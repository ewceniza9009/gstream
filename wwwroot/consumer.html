<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GSTREAM - Broadcast Consumer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .chat-box {
            max-height: calc(100vh - 300px);
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
        }

        .chat-message.self {
            align-self: flex-end;
        }

            .chat-message.self .chat-bubble {
                background-color: #1d4ed8;
            }

        .chat-message.other {
            align-self: flex-start;
        }

            .chat-message.other .chat-bubble {
                background-color: #374151;
            }

        .reaction-container {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            height: 500px;
            overflow: hidden;
            pointer-events: none;
        }

        .reaction-emoji {
            position: absolute;
            bottom: -50px;
            left: var(--lx);
            font-size: 2.5rem;
            animation: floatUp 4s ease-out forwards;
            opacity: 1;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-500px) translateX(var(--tx)) rotate(var(--rot));
                opacity: 0;
            }
        }

        .reaction-buttons {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            background-color: rgba(0,0,0,0.4);
            padding: 0.5rem;
            border-radius: 9999px;
        }

            .reaction-buttons button {
                background: none;
                border: none;
                font-size: 1.5rem;
                cursor: pointer;
                transition: transform 0.2s;
            }

                .reaction-buttons button:hover {
                    transform: scale(1.2);
                }

        .poll-option-btn {
            transition: background-color 0.2s;
        }

            .poll-option-btn:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }

        .poll-progress-bar {
            background-color: #4a5568;
            transition: width 0.3s ease-in-out;
        }

        .poll-display {
            transition: all 0.3s ease-in-out;
            max-height: 500px;
        }

            .poll-display.poll-minimized {
                max-height: 48px;       
                width: 250px;
                overflow: hidden;
            }

                .poll-display.poll-minimized .poll-body {
                    display: none;
                }

        .poll-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .poll-toggle-btn {
            background: none;
            border: none;
            color: white;
            padding-left: 1rem;
        }

        .poll-question-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div id="app-container" class="w-full max-w-6xl p-4 md:p-8">
        <h1 class="text-4xl font-bold text-center mb-2 text-cyan-400">GSTREAM</h1>
        <h2 class="text-xl font-light text-center mb-6 text-gray-300">Broadcast Consumer</h2>

        <div id="api-key-section" class="bg-gray-800 p-8 rounded-lg shadow-xl mx-auto max-w-lg">
            <h2 class="text-2xl font-semibold mb-4 text-center">Connect to gstream</h2>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Enter Your Display Name" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <input type="text" id="api-key" placeholder="Enter Your API Key" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <input type="text" id="room-id" placeholder="Enter the Room ID of the broadcast" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <button id="join-stream-button" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md transition duration-300">Find and View Stream</button>
            </div>
        </div>

        <div id="streaming-section" class="hidden">
            <div class="flex justify-between items-center bg-gray-800 p-4 rounded-lg shadow-xl mb-6">
                <p id="status" class="text-yellow-400"></p>
                <div class="flex items-center gap-4">
                    <div id="viewer-count" class="flex items-center gap-2 text-lg"><i class="fas fa-eye text-green-400"></i><span id="viewer-count-number">0</span></div>
                    <button id="leave-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-md transition duration-300">Leave</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2 bg-gray-800 p-4 rounded-lg shadow-xl relative">
                    <h3 class="text-xl font-semibold mb-2 text-center">Live Broadcast</h3>
                    <video id="remoteVideo" autoplay playsinline class="w-full rounded-md bg-black"></video>
                    <div id="quality-controls" class="flex justify-center space-x-2 mt-4"></div>

                    <div class="reaction-container" id="video-reaction-container"></div>
                    <div class="reaction-buttons">
                        <button data-emoji="👍">👍</button>
                        <button data-emoji="❤️">❤️</button>
                        <button data-emoji="😂">😂</button>
                        <button data-emoji="😮">😮</button>
                        <button data-emoji="🎉">🎉</button>
                    </div>

                    <div id="poll-container" class="absolute top-4 left-4 w-full max-w-sm"></div>
                </div>

                <div id="chat-section" class="md:col-span-1 bg-gray-800 p-4 rounded-lg shadow-xl flex-col hidden h-full">
                    <h3 class="text-xl font-semibold mb-2 text-center">Live Chat</h3>
                    <div id="chat-messages" class="chat-box flex-grow mb-4 p-2 bg-gray-900 rounded"></div>
                    <div class="flex">
                        <input type="text" id="chat-input" placeholder="Type a message..." class="flex-grow bg-gray-700 text-white p-2 rounded-l-md border border-gray-600">
                        <button id="chat-send-button" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-r-md">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.2.0/dist/livekit-client.umd.min.js"></script>
    <script src="js/consumer.js"></script>
</body>
</html>
