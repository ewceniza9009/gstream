<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>gstream - Broadcast Consumer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div id="app-container" class="w-full max-w-2xl p-4 md:p-8">
        <h1 class="text-4xl font-bold text-center mb-2 text-cyan-400">gstream</h1>
        <h2 class="text-xl font-light text-center mb-6 text-gray-300">Broadcast Consumer</h2>

        <!-- API Key and Room ID Section -->
        <div id="api-key-section" class="bg-gray-800 p-8 rounded-lg shadow-xl mx-auto">
            <h2 class="text-2xl font-semibold mb-4 text-center">Connect to gstream</h2>
            <div class="space-y-4">
                <input type="text" id="api-key" placeholder="Enter Your API Key" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <input type="text" id="room-id" placeholder="Enter the Room ID of the broadcast" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <button id="join-stream-button" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md transition duration-300">Find and View Stream</button>
            </div>
        </div>

        <!-- Streaming Section -->
        <div id="streaming-section" class="hidden">
            <div class="flex justify-between items-center bg-gray-800 p-4 rounded-lg shadow-xl mb-6">
                <p id="status" class="text-yellow-400"></p>
                <button id="leave-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-md transition duration-300">Leave</button>
            </div>

            <div id="remote-video-container" class="bg-gray-800 p-4 rounded-lg shadow-xl">
                <h3 class="text-xl font-semibold mb-2 text-center">Live Broadcast</h3>
                <video id="remoteVideo" autoplay playsinline class="w-full rounded-md bg-black"></video>
            </div>
        </div>
    </div>

    <!-- SignalR Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/consumer.js"></script>
</body>
</html>
