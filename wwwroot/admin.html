<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GSTREAM - Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .modal-backdrop {
            background-color: rgba(0,0,0,0.6);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <div id="app-container" class="w-full max-w-7xl mx-auto p-4 md:p-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-4xl font-bold text-cyan-400">GSTREAM</h1>
                <h2 class="text-xl font-light text-gray-300">Admin Dashboard</h2>
            </div>
            <button id="logout-button" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md">Logout</button>
        </div>

        <div class="bg-gray-800 p-6 rounded-lg shadow-xl mb-8">
            <h3 class="text-xl font-semibold text-red-400 mb-4">System Actions</h3>
            <div class="flex gap-4">
                <button id="flush-broadcasts-button" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-4 rounded-md transition duration-300">
                    <i class="fas fa-fire-extinguisher mr-2"></i>Flush All Active Broadcasts
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div id="room-management-section" class="bg-gray-800 p-6 rounded-lg shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-2xl font-semibold">Room Management</h3>
                    <button id="create-room-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2">
                        <i class="fas fa-plus"></i> Create Room
                    </button>
                </div>
                <div class="mb-4 relative">
                    <input type="search" id="room-search-input" placeholder="Search rooms..." class="w-full bg-gray-700 text-white p-3 pl-10 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                <div id="room-list-container" class="max-h-[60vh] overflow-y-auto pr-2">
                </div>
            </div>

            <div id="user-management-section" class="bg-gray-800 p-6 rounded-lg shadow-xl">
                <h3 class="text-2xl font-semibold mb-4">User Management</h3>
                <div class="mb-4 relative">
                    <input type="search" id="user-search-input" placeholder="Search users..." class="w-full bg-gray-700 text-white p-3 pl-10 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                <div id="user-list-container" class="max-h-[60vh] overflow-y-auto pr-2">
                </div>
            </div>
        </div>
    </div>

    <div id="room-modal" class="fixed inset-0 z-50 items-center justify-center hidden modal-backdrop">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">
            <h3 id="room-modal-title" class="text-xl font-semibold mb-4">Create Room</h3>
            <form id="room-modal-form">
                <input type="hidden" id="room-id-modal">
                <div>
                    <label for="room-name-modal" class="block text-sm font-medium text-gray-300 mb-1">Room Name</label>
                    <input type="text" id="room-name-modal" required maxlength="100" class="w-full bg-gray-700 text-white p-2 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>
                <div class="mt-6 flex justify-end gap-4">
                    <button type="button" id="close-modal-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-md">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="user-modal" class="fixed inset-0 z-50 items-center justify-center hidden modal-backdrop">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">
            <h3 id="user-modal-title" class="text-xl font-semibold mb-4">Edit User</h3>
            <form id="user-modal-form">
                <input type="hidden" id="user-id-modal">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                        <p id="user-name-modal" class="text-lg font-semibold"></p>
                    </div>
                    <div>
                        <label for="user-role-modal" class="block text-sm font-medium text-gray-300 mb-1">Role</label>
                        <select id="user-role-modal" class="w-full bg-gray-700 text-white p-2 rounded-md border border-gray-600">
                            <option value="Consumer">Consumer</option>
                            <option value="Broadcaster">Broadcaster</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <div>
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="user-blocked-modal" class="form-checkbox h-5 w-5 text-red-600 bg-gray-700 border-gray-600">
                            <span class="ml-2 text-white">Is Blocked</span>
                        </label>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-4">
                    <button type="button" id="close-user-modal-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
