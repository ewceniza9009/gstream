<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GSTREAM - One-to-One Streaming</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        video {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div id="app-container" class="w-full max-w-4xl p-4 md:p-8">
        <h1 class="text-4xl font-bold text-center mb-6 text-cyan-400">GSTREAM</h1>

        <div id="login-section" class="bg-gray-800 p-8 rounded-lg shadow-xl max-w-sm mx-auto">
            <h2 class="text-2xl font-semibold mb-4 text-center">Login</h2>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Username (admin)" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <input type="password" id="password" placeholder="Password (adminpassword)" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                <button id="login-button" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-md transition duration-300">Login</button>
            </div>
            <p id="login-error" class="text-red-400 mt-4 text-center"></p>
        </div>

        <div id="streaming-section" class="hidden">
            <div class="bg-gray-800 p-6 rounded-lg shadow-xl mb-6">
                <div class="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-4">
                    <input type="text" id="room-id" placeholder="Enter Room ID" class="flex-grow bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    <button id="join-room-button" class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-md transition duration-300">Join Room</button>
                    <button id="leave-room-button" class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-md transition duration-300 hidden">Leave Room</button>
                </div>
                <p id="status" class="text-center mt-4 text-yellow-400"></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-gray-800 p-4 rounded-lg shadow-xl">
                    <h3 class="text-xl font-semibold mb-2 text-center">My Camera</h3>
                    <video id="localVideo" autoplay playsinline muted class="w-full rounded-md bg-black"></video>
                </div>
                <div class="bg-gray-800 p-4 rounded-lg shadow-xl">
                    <h3 class="text-xl font-semibold mb-2 text-center">Remote Stream</h3>
                    <video id="remoteVideo" autoplay playsinline class="w-full rounded-md bg-black"></video>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="js/streaming.js"></script>
</body>
</html>
