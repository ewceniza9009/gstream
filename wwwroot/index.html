<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GSTREAM - Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div id="app-container" class="w-full max-w-4xl p-4 md:p-8 text-center">
        <h1 class="text-5xl font-bold mb-4 text-cyan-400">GSTREAM</h1>
        <p class="text-xl text-gray-300 mb-12">Real-Time Video Streaming</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <a href="/broadcast.html" class="bg-gray-800 p-8 rounded-lg shadow-xl hover:bg-gray-700 hover:ring-2 hover:ring-cyan-500 transition duration-300">
                <h2 class="text-2xl font-semibold mb-2">📢 Broadcast</h2>
                <p class="text-gray-400">Stream from your camera to a large audience using a scalable SFU.</p>
            </a>

            <a href="/streaming.html" class="bg-gray-800 p-8 rounded-lg shadow-xl hover:bg-gray-700 hover:ring-2 hover:ring-green-500 transition duration-300">
                <h2 class="text-2xl font-semibold mb-2">🔗 One-to-One Call</h2>
                <p class="text-gray-400">Create a private, peer-to-peer video call with one other person.</p>
            </a>

            <a href="/consumer.html" class="bg-gray-800 p-8 rounded-lg shadow-xl hover:bg-gray-700 hover:ring-2 hover:ring-yellow-500 transition duration-300">
                <h2 class="text-2xl font-semibold mb-2">👀 View a Broadcast</h2>
                <p class="text-gray-400">Watch a live broadcast by entering a Room ID and API Key.</p>
            </a>
        </div>
    </div>

</body>
</html>
