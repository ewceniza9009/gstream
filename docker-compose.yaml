version: '3.8'

services:
  # The gstream ASP.NET Application
  gstream-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gstream-app
    ports:
      - "5107:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal;Database=gstream;User Id=gstream_user;Password=gstream_pass;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: "gstream-api"
      Jwt__Audience: "gstream-clients"
      Jwt__Key: "A_VERY_LONG_AND_SECURE_SECRET_KEY_FOR_JWT_SIGNING_32_CHARS"
      LiveKit__Url: "ws://192.168.1.7:7880"
      LiveKit__PrivateUrl: "http://livekit:7880"
      LiveKit__ApiKey: "APIKeyForGStream"
      LiveKit__ApiSecret: "ThisIsMyNewVerySecureSecretKeyForLiveKit32"
      ASPNETCORE_URLS: "http://+:8080"
      PublicUrl: "http://192.168.1.7:5107"
    depends_on:
      - redis
      - livekit
    networks:
      - gstream-network

  # LiveKit Media Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: gstream-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - gstream-network

  # --- LIVEKIT EGRESS SERVICE FOR RECORDING (UPDATED) ---
  livekit-egress:
    image: livekit/egress:latest
    container_name: gstream-livekit-egress
    restart: always
    # We are no longer running as root
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: APIKeyForGStream
        api_secret: ThisIsMyNewVerySecureSecretKeyForLiveKit32
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    volumes:
      # --- THIS IS THE FIX ---
      # Bind-mount a local folder instead of using a named volume
      - ./recordings:/mnt/recordings
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gstream-network
    depends_on:
      - livekit
      - redis

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: gstream-redis
    ports:
      - "6379:6379"
    networks:
      - gstream-network

networks:
  gstream-network:
    driver: bridge

# The top-level volumes key is no longer needed for recordings
# volumes:
#   recordings_volume:
