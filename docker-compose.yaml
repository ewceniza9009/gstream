services:
  # --- NGINX Load Balancer for SSL/HTTPS ---
  nginx-lb:
    image: nginx:stable-alpine
    container_name: gstream-load-balancer-dev
    ports:
      - "${PUBLIC_HTTP_PORT}:80"
      - "${PUBLIC_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/ssl:ro
    depends_on:
      gstream-app:
        condition: service_healthy
    networks:
      - gstream-network

  # --- The gstream ASP.NET Application (Single Instance) ---
  gstream-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gstream-app-dev
    environment:
      ConnectionStrings__DefaultConnection: "Server=${DB_SERVER};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASS};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "${REDIS_HOST}:${REDIS_PORT}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
      Jwt__Key: "${JWT_KEY}"
      LiveKit__Url: "wss://${DOMAIN_OR_IP}:${PUBLIC_HTTPS_PORT}/livekit"
      LiveKit__PrivateUrl: "http://livekit:${LIVEKIT_INTERNAL_PORT}"
      LiveKit__ApiKey: "${LIVEKIT_API_KEY}"
      LiveKit__ApiSecret: "${LIVEKIT_API_SECRET}"
      ASPNETCORE_URLS: "http://+:${GSTREAM_APP_INTERNAL_PORT}"
      PublicUrl: "https://${DOMAIN_OR_IP}:${PUBLIC_HTTPS_PORT}"
    depends_on:
      livekit:
        condition: service_healthy
    networks:
      - gstream-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${GSTREAM_APP_INTERNAL_PORT}/api/config"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- LIVEKIT EGRESS SERVICE FOR RECORDING ---
  livekit-egress:
    image: livekit/egress:latest
    container_name: gstream-livekit-egress
    restart: always
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:${LIVEKIT_INTERNAL_PORT}
        insecure: true
        redis:
          address: ${REDIS_HOST}:${REDIS_PORT}
    volumes:
      - ./recordings:/mnt/recordings
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gstream-network
    depends_on:
      livekit:
        condition: service_healthy

  # --- Backend Services ---
  livekit:
    build:
      context: .
      dockerfile: Dockerfile.livekit
    container_name: gstream-livekit-dev
    command: --config /etc/livekit.yaml
    ports:
      - "${LIVEKIT_INTERNAL_PORT}:${LIVEKIT_INTERNAL_PORT}"
      - "7881:7881"
      - "50101-50201:50101-50201/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    networks:
      - gstream-network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${LIVEKIT_INTERNAL_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  redis:
    image: redis:alpine
    container_name: gstream-redis-dev
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - gstream-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  gstream-network:
    driver: bridge