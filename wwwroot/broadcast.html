<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GSTREAM - Broadcast</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827;
            background-image: radial-gradient(circle at center, #1f2937, #111827);
        }

        #localVideo {
            transform: scaleX(-1);
        }

        #screenShareVideo {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        .chat-box {
            /* Flex grow will handle height */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-message.self {
            align-self: flex-end;
        }

            .chat-message.self .chat-bubble {
                background-color: #1d4ed8;
            }

        .chat-message.other {
            align-self: flex-start;
        }

            .chat-message.other .chat-bubble {
                background-color: #374151;
            }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 6px;
            border: 2px solid #1f2937;
        }

            ::-webkit-scrollbar-thumb:hover {
                background-color: #6b7280;
            }

        * {
            scrollbar-width: thin;
            scrollbar-color: #4b5563 #1f2937;
        }

        .reaction-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .reaction-emoji {
            position: absolute;
            bottom: -50px;
            left: calc(50% - 25px);
            font-size: 2.5rem;
            animation: floatUp 4s ease-out forwards;
            opacity: 1;
        }

        @keyframes floatUp {
            to {
                transform: translateY(-500px) translateX(var(--tx)) rotate(var(--rot));
                opacity: 0;
            }
        }

        .poll-progress-bar {
            background-color: #4a5568;
            transition: width 0.3s ease-in-out;
        }

        .modal-backdrop {
            background-color: rgba(0,0,0,0.6);
        }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <div id="app-container" class="min-h-screen w-full flex flex-col items-center justify-center p-4">
        <div id="login-header" class="text-center mb-8">
            <h1 class="text-5xl md:text-6xl font-bold text-cyan-400 flex items-center justify-center gap-4"><i class="fa-solid fa-satellite-dish"></i><span>GSTREAM</span></h1>
            <h2 class="text-lg text-gray-400 tracking-widest mt-2">BROADCAST DASHBOARD</h2>
        </div>

        <div id="dashboard-header" class="hidden w-full max-w-7xl mb-6">
            <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                <div class="text-center md:text-left">
                    <h1 class="text-4xl font-bold text-cyan-400">GSTREAM</h1>
                    <h2 class="text-xl font-light text-gray-300">Broadcast Dashboard</h2>
                </div>
                <div id="nav-links" class="flex items-center justify-center flex-wrap gap-4">
                    <a href="/account.html" class="text-cyan-400 hover:text-cyan-300 transition-colors">My Account</a>
                    <a href="/admin.html" id="admin-link" class="hidden bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md transition-colors">Admin Panel</a>
                    <button id="logout-button" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-md transition-colors">Logout</button>
                </div>
            </div>
        </div>

        <div id="login-section" class="w-full max-w-md">
            <div class="bg-gray-900/50 backdrop-blur-sm p-8 rounded-2xl shadow-2xl shadow-cyan-500/10 ring-1 ring-white/10">
                <div id="login-form">
                    <h2 class="text-2xl font-semibold mb-6 text-center text-white">Login to Broadcast</h2>
                    <div class="space-y-4">
                        <div class="relative"><i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" id="username" placeholder="Username" value="broadcaster1" class="w-full bg-gray-800/50 text-white pl-10 p-3 rounded-lg border-0 ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"></div>
                        <div class="relative"><i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="password" id="password" placeholder="Password" value="password" class="w-full bg-gray-800/50 text-white pl-10 p-3 rounded-lg border-0 ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"></div>
                        <button id="login-button" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 shadow-lg shadow-cyan-500/20 hover:shadow-cyan-500/40">Login</button>
                    </div>
                    <p id="login-error" class="text-red-400 mt-4 text-center h-5"></p>
                    <p class="text-center mt-4 text-sm text-gray-400">Don't have an account? <a href="#" id="show-register-link" class="font-medium text-cyan-400 hover:underline">Register</a></p>
                </div>
                <div id="register-form" class="hidden">
                    <h2 class="text-2xl font-semibold mb-6 text-center">Create Account</h2>
                    <div class="space-y-4">
                        <div class="relative"><i class="fa-solid fa-user-plus absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="text" id="register-username" placeholder="Username" class="w-full bg-gray-800/50 text-white pl-10 p-3 rounded-lg border-0 ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"></div>
                        <div class="relative"><i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="password" id="register-password" placeholder="Password" class="w-full bg-gray-800/50 text-white pl-10 p-3 rounded-lg border-0 ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"></div>
                        <div class="relative"><i class="fa-solid fa-check-double absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i><input type="password" id="register-confirm-password" placeholder="Confirm Password" class="w-full bg-gray-800/50 text-white pl-10 p-3 rounded-lg border-0 ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"></div>
                        <button id="register-button" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300">Register</button>
                    </div>
                    <p id="register-error" class="text-red-400 mt-4 text-center h-5"></p>
                    <p class="text-center mt-4 text-sm text-gray-400">Already have an account? <a href="#" id="show-login-link" class="font-medium text-cyan-400 hover:underline">Login</a></p>
                </div>
            </div>
        </div>

        <div id="broadcast-dashboard" class="hidden w-full max-w-7xl">
            <div id="room-selection-section">
                <h3 class="text-2xl font-semibold mb-4">Select a Room to Broadcast</h3>
                <div class="mb-4 relative">
                    <input type="search" id="room-search-input" placeholder="Search rooms..." class="w-full bg-gray-700 text-white p-3 pl-10 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
                <div id="room-list-container" class="max-h-[70vh] overflow-y-auto pr-2">
                    <div id="room-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
                </div>
            </div>

            <div id="configure-section" class="hidden bg-gray-800 p-8 rounded-2xl shadow-xl max-w-7xl mx-auto mt-8 ring-1 ring-white/10">
                <button id="back-to-rooms-btn" class="mb-6 text-cyan-400 hover:underline"><i class="fas fa-arrow-left mr-2"></i>Back to Room Selection</button>
                <h3 class="text-2xl font-semibold mb-6 text-center">Configure Stream for <span id="selected-room-name" class="text-cyan-400"></span></h3>
                <input type="hidden" id="room-id">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                    <div>
                        <label class="block text-gray-300 mb-2 font-medium">Broadcast Type:</label>
                        <div class="flex items-center space-x-6">
                            <label class="flex items-center cursor-pointer"><input type="radio" name="broadcastType" value="sfu" checked class="form-radio h-5 w-5 text-cyan-600 bg-gray-700 border-gray-600 focus:ring-cyan-500"><span class="ml-2 text-white">SFU (Recommended)</span></label>
                            <label class="flex items-center cursor-pointer"><input type="radio" name="broadcastType" value="mesh" class="form-radio h-5 w-5 text-cyan-600 bg-gray-700 border-gray-600 focus:ring-cyan-500"><span class="ml-2 text-white">Mesh (1-2 viewers)</span></label>
                        </div>
                    </div>

                    <div>
                        <label class="block text-gray-300 mb-2 font-medium">Video Source:</label>
                        <div class="flex items-center space-x-6">
                            <label class="flex items-center cursor-pointer"><input type="radio" name="videoSource" value="system" checked class="form-radio h-5 w-5 text-cyan-600 bg-gray-700 border-gray-600 focus:ring-cyan-500"><span class="ml-2 text-white">System Camera</span></label>
                            <label class="flex items-center cursor-pointer"><input type="radio" name="videoSource" value="ip" class="form-radio h-5 w-5 text-cyan-600 bg-gray-700 border-gray-600 focus:ring-cyan-500"><span class="ml-2 text-white">IP Camera</span></label>
                        </div>
                    </div>

                    <div id="system-camera-section" class="md:col-span-2">
                        <label for="camera-select" class="block text-gray-300 mb-2 font-medium">Select Camera:</label>
                        <div class="flex items-center gap-2">
                            <select id="camera-select" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500"></select>
                            <button id="refresh-cameras-btn" title="Refresh Camera List" class="bg-gray-600 hover:bg-gray-500 text-white font-bold p-3 rounded-md transition-colors"><i class="fas fa-sync-alt"></i></button>
                        </div>
                    </div>

                    <div id="ip-camera-section" class="hidden md:col-span-2">
                        <label for="ip-camera-url" class="block text-gray-300 mb-2 font-medium">IP Camera Stream URL:</label>
                        <input type="text" id="ip-camera-url" placeholder="e.g., http://192.168.1.10/video.mjpg" class="w-full bg-gray-700 text-white p-3 rounded-md border border-gray-600 focus:outline-none focus:ring-2 focus:ring-cyan-500">
                    </div>
                </div>

                <div class="flex flex-col gap-4 mt-8">
                    <button id="start-broadcast-button" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300">Start Broadcast</button>
                </div>
            </div>
        </div>

        <div id="streaming-section" class="hidden w-full max-w-7xl">
            <div class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-4 rounded-lg shadow-xl mb-6 gap-4">
                <p id="status" class="text-yellow-400 text-center md:text-left"></p>
                <div class="flex items-center justify-center flex-wrap gap-2">
                    <div id="viewer-count" class="flex items-center gap-2 text-lg"><i class="fas fa-eye text-green-400"></i><span id="viewer-count-number">0</span></div>
                    <button id="start-screenshare-button" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2 text-sm"><i class="fas fa-desktop"></i> Share Screen</button>
                    <button id="stop-screenshare-button" class="hidden bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2 text-sm"><i class="fas fa-stop-circle"></i> Stop Sharing</button>
                    <button id="create-poll-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2 text-sm"><i class="fas fa-poll"></i> Create Poll</button>
                    <button id="record-button" class="bg-purple-800 hover:bg-purple-900 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2 text-sm"><i class="fas fa-record-vinyl"></i> Record</button>
                    <button id="stop-record-button" class="hidden bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-4 rounded-md flex items-center gap-2 text-sm"><i class="fas fa-stop"></i> Stop</button>
                    <button id="leave-button" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md text-sm">Leave</button>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-4">
                    <div id="local-video-container" class="bg-gray-800 p-4 rounded-lg shadow-xl hidden w-full relative">
                        <h3 class="text-xl font-semibold mb-2 text-center">My Camera</h3>
                        <video id="localVideo" autoplay playsinline muted class="w-full rounded-md bg-black"></video>
                        <div class="reaction-container" id="camera-reaction-container"></div>
                    </div>
                    <div id="screenshare-container" class="hidden bg-gray-800 p-4 rounded-lg shadow-xl w-full relative">
                        <h3 class="text-xl font-semibold mb-2 text-center">My Screen Share</h3>
                        <video id="screenShareVideo" autoplay playsinline muted class="w-full rounded-md bg-black"></video>
                        <div class="reaction-container" id="screen-reaction-container"></div>
                    </div>
                    <div id="poll-results-container" class="hidden bg-gray-800 p-6 rounded-lg shadow-xl w-full"></div>
                </div>
                <div id="chat-section" class="lg:col-span-1 bg-gray-800 p-4 rounded-lg shadow-xl flex flex-col hidden h-[45vh] md:h-[65vh]">
                    <h3 class="text-xl font-semibold mb-2 text-center">Live Chat</h3>
                    <div id="chat-messages" class="chat-box flex-grow mb-4 p-2 bg-gray-900 rounded"></div>
                    <div class="flex">
                        <input type="text" id="chat-input" placeholder="Type a message..." class="flex-grow bg-gray-700 text-white p-2 rounded-l-md border border-gray-600">
                        <button id="chat-send-button" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-4 rounded-r-md">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="poll-modal" class="fixed inset-0 z-50 items-center justify-center hidden modal-backdrop">
        <div class="bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md">
            <h3 class="text-xl font-semibold mb-4">Create a New Poll</h3>
            <form id="poll-modal-form">
                <div class="space-y-4">
                    <div>
                        <label for="poll-question" class="block text-sm font-medium text-gray-300 mb-1">Question</label>
                        <input type="text" id="poll-question" required maxlength="200" class="w-full bg-gray-700 text-white p-2 rounded-md border border-gray-600">
                    </div>
                    <div id="poll-options-container">
                        <div><label class="block text-sm font-medium text-gray-300 mb-1">Option 1</label><input type="text" name="poll-option" required maxlength="100" class="w-full bg-gray-700 text-white p-2 rounded-md border border-gray-600"></div>
                        <div><label class="block text-sm font-medium text-gray-300 mb-1">Option 2</label><input type="text" name="poll-option" required maxlength="100" class="w-full bg-gray-700 text-white p-2 rounded-md border border-gray-600"></div>
                    </div>
                    <button type="button" id="add-poll-option-btn" class="text-sm text-cyan-400 hover:underline">Add another option</button>
                </div>
                <div class="mt-6 flex justify-end gap-4">
                    <button type="button" id="close-poll-modal-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md">Cancel</button>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">Start Poll</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.2.0/dist/livekit-client.umd.min.js"></script>
    <script src="/js/broadcast.js"></script>
</body>
</html>
